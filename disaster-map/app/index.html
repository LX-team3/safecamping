<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="campine">
<title>campine 대피지도</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Widgets/widgets.css">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.123.0/Build/Cesium/Cesium.js"></script>
<!-- 인북천 물빛테마공원 캠핑장 정밀 데이터 (QGIS에서 잘라 만든 data.js) -->
<script src="data.js"></script>
<style>
/* 레이아웃: 휴대폰 한 화면. 지도가 화면 전체, 위에 상태바·기상특보·물 높이 카드, 아래에 대피 시트. 야간 사용을 고려한 어두운 화면 */
:root {
  --ground: #0B1014;
  --sheet: #141B21;
  --card: #1C252C;
  --line: #2B3741;
  --text: #EEF2F4;
  --muted: #9BAAB5;
  --water: #4C9BE8;
  --safe: #5FC795;
  --caution: #F2C14E;
  --alert: #F28C3B;
  --severe: #EF5B4C;
  --font-ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, monospace;
  --lv: var(--alert);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: #070A0D; color: var(--text); font-family: var(--font-ui); font-size: 15px; overflow: hidden; }
[hidden] { display: none !important; }
.phone { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; background: var(--ground); }
.stage { position: absolute; inset: 0; touch-action: none; }
.cesium-widget-credits { display: none !important; }
#credits { position: absolute; right: 8px; bottom: 174px; z-index: 4; font-size: 9px; color: rgba(255,255,255,.55); pointer-events: none; text-align: right; }
#credits a { color: inherit; pointer-events: auto; }

.topbar { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 28px max(14px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(11,16,20,0.92), rgba(11,16,20,0)); pointer-events: none; }
.place { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.place .app { font-size: 12px; font-weight: 700; color: var(--water); letter-spacing: 0.04em; }
.place h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; }
.place .loc { font-size: 12px; color: var(--muted); }
.site-pick { pointer-events: auto; margin-top: 4px; max-width: 210px; font: inherit; font-size: 12px; font-weight: 700; color: var(--text); background: rgba(20,27,33,0.85); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }

.alert { pointer-events: auto; max-width: 62%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.alert-pill { font: inherit; display: flex; align-items: center; gap: 8px; border: 0; cursor: pointer; text-align: left;
  background: #F2C14E; color: #2A1E00; border-radius: 12px; padding: 8px 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
.alert-pill.warn { background: #EF5B4C; color: #fff; }
.alert-pill .ico { width: 18px; height: 18px; flex: none; }
.alert-pill b { font-size: 14px; display: block; }
.alert-pill small { font-size: 11px; opacity: 0.85; display: block; }
.alert-card { background: rgba(20,27,33,0.97); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
.alert-card p { margin: 0 0 6px; }
.alert-card .src { color: var(--muted); font-size: 11px; margin: 0; }

/* 위에 따로 뜨는 물 높이 카드 */
.flood { position: absolute; z-index: 6; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  top: calc(80px + env(safe-area-inset-top, 0px)); background: rgba(20,27,33,0.9); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.4); padding: 6px 10px 4px; display: flex; flex-direction: column; gap: 0; backdrop-filter: blur(8px); }
.fl-top { display: flex; align-items: center; gap: 6px; }
.fl-k { font-size: 11px; color: var(--muted); }
.fl-v { font-size: 11px; color: var(--muted); margin-right: auto; }
.fl-v b { font-family: var(--font-num); font-size: 15px; color: var(--text); margin-right: 1px; }
.fl-stage { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--card); }
.fl-stage i { width: 8px; height: 8px; border-radius: 50%; background: var(--lv); }
.fl-src { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; }
.fl-src.ai { color: var(--water); border-color: var(--water); }
#rain { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; touch-action: pan-x; cursor: pointer; }
#rain::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track); }
#rain::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track); }
#rain::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -7px; border-radius: 50%; background: #fff; border: 3px solid #0B1014; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
#rain::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid #0B1014; }
#rain:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; border-radius: 6px; }
.ticks { position: relative; height: 12px; margin: -5px 10px 0; font-family: var(--font-num); font-size: 9.5px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span b { font-family: var(--font-ui); font-weight: 700; color: var(--text); margin-left: 2px; }
.ticks span.ref { opacity: 0.6; }

/* 지도 돌리기: 나침반을 좌우로 끌면 360도 회전, 누르면 북쪽 위로 */
.compass { position: absolute; z-index: 6; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(146px + env(safe-area-inset-top, 0px));
  width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: rgba(20,27,33,0.9); padding: 0; cursor: grab;
  box-shadow: 0 6px 18px rgba(0,0,0,0.4); touch-action: none; display: grid; place-items: center; backdrop-filter: blur(8px); }
.compass:active { cursor: grabbing; }
.compass svg { width: 44px; height: 44px; display: block; }
.compass:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
.compass .hint { position: absolute; top: 56px; right: 0; white-space: nowrap; font-size: 10px; color: var(--muted); text-shadow: 0 1px 2px #000; pointer-events: none; }

.tag { position: absolute; z-index: 3; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
  font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 7px; margin-top: -8px; }
.tag.me { background: var(--water); color: #04121F; margin-top: -80px; }
.tag.shelter { background: var(--safe); color: #04170D; }
.tag.road { background: rgba(11,16,20,0.75); color: var(--text); font-weight: 500; font-size: 11px; }
.tag.bad { background: rgba(60,66,72,0.92); color: #E8ECEF; font-size: 11px; }
.tag.bridge { background: rgba(11,16,20,0.85); color: var(--caution); font-size: 11px; }
.tag.cut { background: var(--severe); color: #fff; font-size: 11px; }
.tag.river { background: transparent; color: #BFE0FF; font-size: 12px; text-shadow: 0 1px 3px #000; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--sheet); border-radius: 20px 20px 0 0;
  box-shadow: 0 -10px 30px rgba(0,0,0,0.45); max-height: 40%; overflow-y: auto; overscroll-behavior: contain;
  padding-block: 6px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; transition: max-height 0.25s ease; }
.sheet.min { max-height: 168px; }
.grab { font: inherit; align-self: center; width: 64px; height: 22px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; flex: none; }
.grab::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: #3A4752; }
.grab:focus-visible { outline: 2px solid var(--water); border-radius: 6px; }

.state { display: flex; gap: 12px; align-items: flex-start; }
.badge { flex: none; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 8px; background: var(--lv); color: #120A02; }
.state h2 { margin: 0; font-size: 19px; line-height: 1.4; font-weight: 700; text-wrap: balance; }
.state p { margin: 4px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }

.shelter { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; background: var(--card); border-radius: 14px; padding: 14px; }
.shelter .k { font-size: 12px; color: var(--muted); }
.shelter .name { font-size: 17px; font-weight: 700; }
.shelter .meta { font-size: 13px; color: var(--muted); }
.shelter .dist { grid-row: 1 / span 3; grid-column: 2; align-self: center; text-align: right; }
.shelter .dist b { font-family: var(--font-num); font-size: 22px; display: block; }
.shelter .dist small { font-size: 11px; color: var(--muted); }
.shelter .where { font: inherit; justify-self: start; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--water); background: none; border: 1px solid var(--water); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.state { align-items: center; }
.tag.goal { background: var(--alert); color: #120A02; font-size: 13px; padding: 5px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.5); }

.btn { font: inherit; font-weight: 700; border: 0; border-radius: 14px; cursor: pointer; min-height: 52px; font-size: 16px; }
.btn.primary { background: var(--lv); color: #120A02; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); min-height: 46px; font-size: 14px; }
.btn:focus-visible, .seg button:focus-visible, .alert-pill:focus-visible, .steps button:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
.actions { display: grid; gap: 8px; }

.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h3 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 500; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: var(--card); padding: 4px; border-radius: 12px; margin-top: -4px; }
.seg button { font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); background: transparent; border: 0; border-radius: 9px; height: 38px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: #0B1014; }
.seg button:disabled { opacity: 0.38; cursor: not-allowed; text-decoration: line-through; }
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.todo li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 14px; line-height: 1.5; background: var(--card); border-radius: 12px; padding: 10px 12px; }
.todo li span:first-child { font-family: var(--font-num); color: var(--lv); font-weight: 700; }
.emergency { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.emergency b { font-family: var(--font-num); font-size: 20px; color: var(--text); user-select: all; }
.route-note { margin: -6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
#detourBtn { border-color: var(--caution); color: var(--caution); }

/* 길안내 모드 */
.nav-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.progress { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--lv); width: 0; transition: width 0.4s ease; }
.nav-step { display: flex; flex-direction: column; gap: 6px; }
.nav-step .no { font-family: var(--font-num); color: var(--lv); font-size: 13px; font-weight: 700; }
.nav-step h2 { margin: 0; font-size: 22px; line-height: 1.35; text-wrap: balance; }
.nav-step .caution { margin: 0; font-size: 14px; color: var(--caution); font-weight: 700; }
.nav-step .sub { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
.nav-btns { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }

#loading { position: absolute; inset: 0; z-index: 30; background: var(--ground); color: var(--muted); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; font-size: 14px; transition: opacity .5s; }
#loading .spin { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--water); border-radius: 50%; animation: s 1s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sheet, .progress i { transition: none; } #loading .spin { animation: none; } }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="stage" id="stage"></div>
  <div id="credits"></div>

  <header class="topbar">
    <div class="place">
      <span class="app">campine</span>
      <h1>호우 및 침수 시 대피경로</h1>
      <span class="loc" id="locLine">인북천 물빛테마공원 캠핑장 · 인제군 서화면</span>    </div>
    <div class="alert" id="alertBox">
      <button type="button" class="alert-pill" id="alertPill" aria-expanded="false" aria-controls="alertCard">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>
        <span><b id="alertTitle">기상특보 확인 중</b><small id="alertTime"></small></span>
      </button>
      <div class="alert-card" id="alertCard" hidden>
        <p id="alertArea"></p>
        <p id="alertBody"></p>
        <p class="src" id="alertSrc"></p>
      </div>
    </div>
  </header>

  <!-- 위에 따로 뜨는 강수량 슬라이더: 밀면 물이 차오르는 범위가 바뀜 -->
  <section class="flood" id="flood" aria-label="강수량에 따라 잠기는 범위">
    <div class="fl-top">
      <span class="fl-k">3시간 강수량</span>
      <span class="fl-v"><b id="rainVal">60</b>mm</span>
      <span class="fl-stage" id="stageChip"><i id="stageDot"></i><span id="stageTxt">주의</span></span>
      <span class="fl-src" id="judgeSrc">기준표</span>
    </div>
    <input type="range" id="rain" min="0" max="200" step="5" value="60" aria-label="3시간 강수량">
    <div class="ticks" id="ticks" aria-hidden="true"></div>
  </section>

  <button type="button" class="compass" id="compass" aria-label="지도 돌리기. 좌우로 끌면 회전, 누르면 북쪽이 위로">
    <svg viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="19" fill="none" stroke="#3A4752" stroke-width="2" stroke-dasharray="3 3"/>
      <g id="needle">
        <path d="M22 6 L27 22 L17 22 Z" fill="#EF5B4C"/><path d="M22 38 L27 22 L17 22 Z" fill="#C9D2D8"/>
        <text x="22" y="5.5" text-anchor="middle" font-size="7" font-weight="700" fill="#EF5B4C" font-family="IBM Plex Mono, monospace">N</text>
      </g>
    </svg>
    <span class="hint">↔ 돌리기</span>
  </button>

  <section class="sheet" id="sheet" aria-label="대피 안내">
    <button type="button" class="grab" id="grab" aria-label="안내 접기·펼치기" aria-expanded="true"></button>

    <!-- 기본 화면 -->
    <div id="overview" class="sec" style="gap:14px">
      <div class="state">
        <span class="badge" id="lvBadge">경계</span>
        <div><h2 id="lvHead">-</h2><p id="sumLine"></p></div>
      </div>

      <div class="shelter">
        <span class="name" id="destName">서화중앙교회</span>
        <span class="meta" id="destMeta">대피소 · 양지교 경유</span>
        <button type="button" class="where" id="whereBtn">위치 보기</button>
        <div class="dist"><b><span id="distKm">1.52</span><span style="font-size:13px" id="distUnit">km</span></b><small id="distMin">도보 약 16분</small></div>
      </div>
      <div class="seg" role="group" aria-label="경로 선택" id="routeSeg">
        <button type="button" data-r="base" aria-pressed="true">대피소 (양지교)</button>
        <button type="button" data-r="detour" aria-pressed="false">높은 곳 (참고)</button>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="startNav">대피 길안내 시작</button>
        <button type="button" class="btn ghost" id="tourBtn">▶ 대피 경로 따라가기</button>
      </div>

      <div class="sec">
        <h3>침수 시 행동요령</h3>
        <ul class="todo" id="todo"></ul>
      </div>

      <div class="emergency"><span>긴급 신고</span><b>119</b></div>
    </div>

    <!-- 길안내 화면 -->
    <div id="nav" class="sec" style="gap:14px" hidden>
      <div class="nav-top"><span id="navLeft">서화중앙교회까지</span><span id="navCount">1 / 4</span></div>
      <div class="progress" aria-hidden="true"><i id="navBar"></i></div>
      <div class="nav-step" aria-live="polite">
        <span class="no" id="navNo">1단계</span>
        <h2 id="navHead">-</h2>
        <p class="caution" id="navCaution" hidden></p>
        <p class="sub" id="navSub"></p>
      </div>
      <div class="nav-btns">
        <button type="button" class="btn ghost" id="prevStep">이전</button>
        <button type="button" class="btn primary" id="nextStep">다음</button>
      </div>
      <button type="button" class="btn ghost" id="detourBtn">양지교가 잠겼어요 · 높은 곳으로</button>
      <button type="button" class="btn ghost" id="endNav">길안내 종료</button>
    </div>
  </section>

  <div id="loading"><div class="spin"></div>3D 지도를 불러오는 중…</div>
</div>

<script>
(async function () {
  const D = window.DATA, $ = id => document.getElementById(id);
  const SITE = D.site || null;            // 자동 생성 캠핑장이면 이름·대피소·높은 곳 정보가 들어 있음
  if (SITE) {
    const a = (SITE.address || '').split(' '), gu = a.find(w => /군$|시$/.test(w)) || '', myeon = a.find(w => /면$|읍$|동$/.test(w)) || '';
    $('locLine').textContent = `${SITE.name} · ${[gu, myeon].filter(Boolean).join(' ')}`;
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ 1. 기상특보 (기상청 API 연결 자리) ============
     실제 앱에서는 서버가 기상청 기상특보 API를 호출해 아래 형태로 넘겨 주면 됩니다.
     지금은 화면 확인용 예시 데이터입니다. */
  const SAMPLE_ALERT = {
    kind: '호우주의보', action: '발표', level: 'watch',      // watch=주의보, warning=경보
    area: '강원도 인제군', issuedAt: '2026-11-13T12:00:00+09:00',
    body: '3시간 강우량 60mm 이상 예상', source: '기상청 기상특보 (예시 데이터)',
    rain3h: 60                                              // 예상 3시간 강수량(mm) → 슬라이더 시작값

    fly(p, camHeading, -35, 300, () => { if (navWalk) navWalk.phase = 'walk'; });
  }
  let navWalk = null;                 // 길안내 중 캐릭터 걷기·카메라 따라가기 상태
  const NAV_SPEED = 85;               // 화면에서 걷는 속도 (m/초, 실제 걸음보다 빠르게 보여 주는 값)
  function stopNavWalk() { if (!navWalk) return; navWalk = null; camera.lookAtTransform(Cesium.Matrix4.IDENTITY); }
  $('startNav').addEventListener('click', () => { stopTour(false); meU = meTarget = 0; overview.hidden = true; nav.hidden = false; setSheet(true); showStep(0); });
  $('prevStep').addEventListener('click', () => showStep(step - 1));
  $('nextStep').addEventListener('click', () => step === STEPS[routeKey].length - 1 ? endNav() : showStep(step + 1));
  $('endNav').addEventListener('click', endNav);
  function endNav() { stopNavWalk(); nav.hidden = true; overview.hidden = false; meTarget = 0; goHome(); }
  const sheet = $('sheet'), grab = $('grab');
  function setSheet(open) { sheet.classList.toggle('min', !open); grab.setAttribute('aria-expanded', String(open)); }
  grab.addEventListener('click', () => setSheet(sheet.classList.contains('min')));
  // 지도를 만지면 시트를 접어서 지도가 가려지지 않게
  viewer.canvas.addEventListener('pointerdown', () => { if (!sheet.classList.contains('min')) setSheet(false); });

  /* ============ 12. 카메라 ============ */
  function fly(ll, heading, pitchDeg, range, done) {
    const opt = { offset: new Cesium.HeadingPitchRange(heading, Cesium.Math.toRadians(pitchDeg), range), duration: reduce ? 0 : 2.2,
      easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT, complete: done };
    camera.flyToBoundingSphere(new Cesium.BoundingSphere(P3(ll[0], ll[1]), 30), opt);
  }
  function goHome() {
    // 지금 경로 전체가 보이게 (뒷산 산길은 짧아서 가까이)
    const s = RT.sphere;
    camera.flyToBoundingSphere(s, { offset: new Cesium.HeadingPitchRange(Cesium.Math.toRadians(20), Cesium.Math.toRadians(routeKey === 'base' ? -38 : -32), Math.max(520, s.radius * 2.9)), duration: reduce ? 0 : 2.4, easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT });
  }
  // 대피 경로 따라가기: 사람이 걸어가고 카메라가 뒤에서 따라감
  let tour = null, camHeading = 0;
  function startTour() {
    if (!nav.hidden) return;
    if (reduce) { meTarget = 1; const e = RT.at(RT.L); fly(e, 0, -40, 500); return; }
    meU = 0; meTarget = 0; tour = { t0: performance.now() };
    const p = RT.at(0), q = RT.at(60); camHeading = headingOf(p, q);
    $('tourBtn').textContent = '■ 미리 보기 멈추기'; setSheet(false); setFloodMin(true);
  }
  function setFloodMin(min) { $('flood').hidden = min; }
  function stopTour(home) {
    if (!tour) return; tour = null; camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    $('tourBtn').textContent = '▶ 대피 경로 따라가기'; setFloodMin(false);
    if (home) { meTarget = 0; goHome(); }
  }
  $('tourBtn').addEventListener('click', () => tour ? stopTour(true) : startTour());
  viewer.canvas.addEventListener('pointerdown', () => { stopTour(false); if (navWalk) { camera.cancelFlight(); stopNavWalk(); } });

  /* ============ 지도 360도 돌리기 ============
     나침반을 좌우로 끌면 화면 가운데를 중심으로 빙 돌고, 그냥 누르면 북쪽이 위로 옵니다.
     (두 손가락으로 비틀어도 돌아가고, 두 손가락을 위아래로 밀면 기울기가 바뀝니다) */
  const needle = $('needle'), compass = $('compass');
  function centerPoint() {
    const ray = camera.getPickRay(new Cesium.Cartesian2(viewer.canvas.clientWidth / 2, viewer.canvas.clientHeight * 0.45));
    return ray && scene.globe.pick(ray, scene);
  }
  function orbit(angle) {
    const c = centerPoint(); if (!c) return;
    camera.lookAtTransform(Cesium.Transforms.eastNorthUpToFixedFrame(c));
    camera.rotateRight(angle);
    camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  }
  let drag = null, northAnim = null;
  compass.addEventListener('pointerdown', e => { stopTour(false); northAnim = null; drag = { x: e.clientX, moved: 0 }; compass.setPointerCapture(e.pointerId); });
  compass.addEventListener('pointermove', e => {
    if (!drag) return; const d = e.clientX - drag.x; drag.x = e.clientX; drag.moved += Math.abs(d);
    orbit(d * 0.012);
  });
  compass.addEventListener('pointerup', () => { if (drag && drag.moved < 4) northAnim = true; drag = null; });
  compass.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { orbit(-0.2); e.preventDefault(); }
    if (e.key === 'ArrowRight') { orbit(0.2); e.preventDefault(); }
  });
  scene.preRender.addEventListener(() => {
    if (!northAnim) return;
    let h = camera.heading; if (h > Math.PI) h -= 2 * Math.PI;
    if (Math.abs(h) < 0.01) { northAnim = null; return; }
    orbit(h * (reduce ? 1 : 0.18));
  });

  /* ============ 13. 매 프레임 ============ */
  let last = performance.now();
  scene.preRender.addEventListener(() => {
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    const sec = now / 1000;
    flowMats.forEach(m => { m.uniforms.time = sec; });
    // 화살표 간격: 화면에서 약 34px마다 하나가 되도록 (멀리서 봐도 뭉개지지 않게)
    [ROUTES.base, ROUTES.detour].filter(Boolean).forEach(r => {
      const mpp = camera.getPixelSize(r.sphere, viewer.canvas.clientWidth, viewer.canvas.clientHeight) || 1;
      r.mat.uniforms.repeat = Math.max(2, r.L / (34 * mpp));
    });
    // 물이 천천히 차오르거나 빠짐
    WATER.forEach(w => { if (!w.prim.empty && Math.abs(w.alpha - w.target) > 0.005) { const a = w.alpha + Math.sign(w.target - w.alpha) * Math.min(Math.abs(w.target - w.alpha), dt * 0.35);
      if (setWaterAlpha(w, a)) w.alpha = a; } });
    if (tour) {
      const k = Math.min(1, (now - tour.t0) / (RT.tourSec * 1000));
      meU = meTarget = k;
      const m = k * RT.L, p = RT.at(m), q = RT.at(Math.min(RT.L, m + 60));
      let h = headingOf(p, q), d = h - camHeading; d = Math.atan2(Math.sin(d), Math.cos(d)); camHeading += d * Math.min(1, dt * 2);
      camera.lookAt(P3(p[0], p[1], 2), new Cesium.HeadingPitchRange(camHeading, Cesium.Math.toRadians(-24), 230));
      if (k >= 1) { stopTour(false); const e = RT.at(RT.L); fly(e, camHeading, -35, 420); }
    } else if (navWalk) {
      // 길안내: 일정한 속도로 걸어가고, 카메라는 뒤에서 부드럽게 따라감
      if (navWalk.phase === 'walk') {
        const step = NAV_SPEED * dt / RT.L, d = meTarget - meU;
        meU = Math.abs(d) <= step ? meTarget : meU + Math.sign(d) * step;
        const m = meU * RT.L, dir = Math.sign(d) || 1, p = RT.at(m), q = RT.at(Math.max(0, Math.min(RT.L, m + dir * 40)));
        let h = headingOf(p, q), dh = h - camHeading; dh = Math.atan2(Math.sin(dh), Math.cos(dh)); camHeading += dh * Math.min(1, dt * 1.2);
        camera.lookAt(P3(p[0], p[1], 2), new Cesium.HeadingPitchRange(camHeading, Cesium.Math.toRadians(-35), 300));
        if (meU === meTarget) stopNavWalk();
      }
    } else {
      meU += (meTarget - meU) * (reduce ? 1 : Math.min(1, dt * 1.6));
    }
    const mp = RT.at(meU * RT.L);
    moving = !!tour || (navWalk ? navWalk.phase === 'walk' : Math.abs(meTarget - meU) * RT.L > 2);
    mePos = P3(mp[0], mp[1], 0.5);
    meTag.p = mePos;
    // 화면에서 오른쪽으로 가면 좌우 반전된 그림 (얼굴이 가는 쪽을 보게)
    if (moving) {
      const ahead = RT.at(Math.min(RT.L, meU * RT.L + 8)), back = RT.at(Math.max(0, meU * RT.L - 8));
      const a = scene.cartesianToCanvasCoordinates(P3(ahead[0], ahead[1])), b = scene.cartesianToCanvasCoordinates(P3(back[0], back[1]));
      if (a && b && Math.abs(a.x - b.x) > 1.5) faceRight = a.x > b.x;
    }
    // 나침반 바늘
    needle.setAttribute('transform', `rotate(${-Cesium.Math.toDegrees(camera.heading)} 22 22)`);
  });
  scene.postRender.addEventListener(placeTags);

  /* ============ 시작 ============ */
  setRoute(routeKey);
  if (ROUTES.base) document.querySelector('#routeSeg button[data-r="base"]').textContent = `대피소 (${ROUTES.base.main ? ROUTES.base.main.name : '도보'})`;
  // 걸어서 갈 대피소가 없으면: 버튼에 가장 가까운 지상 대피시설까지 도로거리 표시
  if (!ROUTES.base) {
    const b = document.querySelector('#routeSeg button[data-r="base"]'), sh = SITE && SITE.shelter;
    b.textContent = sh ? `대피소 (도로 ${(sh.road_m / 1000).toFixed(1)}km · 차량)` : '대피소 (없음)'; b.disabled = true;
  }
  buildRiver(1);
  setSheet(false);   // 처음엔 시트를 접어서 지도가 잘 보이게
  // 특보의 예상 강수량으로 시작 → 기준표/AI가 단계 판단
  fetchAlert().then(a => { showAlert(a); const mm = a && a.rain3h != null ? a.rain3h : 0; rain.value = mm; setRain(mm, true); });
  { const other = shelter || hEnd, cx = (camp[0] + other[0]) / 2, cy = (camp[1] + other[1]) / 2;
    camera.setView({ destination: Cesium.Cartesian3.fromDegrees(cx, cy - 0.03, 4000), orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45) } }); }
  goHome();
  // 첫 타일이 다 들어오면 로딩 화면 제거
  { let ok = 0; const t0 = performance.now();
    const timer = setInterval(() => { const w = performance.now() - t0; ok = scene.globe.tilesLoaded ? ok + 1 : 0;
      if (w < 8000 && (w < 2500 || ok < 4)) return;
      clearInterval(timer); const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 500); }, 300); }

  // PWA: 오프라인 캐시
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})().catch(e => {
  const l = document.getElementById('loading'); if (l) l.textContent = '3D 지도를 불러오지 못했어요: ' + e.message; console.error(e);
});
</script>
</body>
</html>
